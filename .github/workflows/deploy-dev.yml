name: Deploy Dev

# 開発用プロジェクト（c-mikata / survey-app-dev）へのデプロイ
#   PR（develop・main 向け） → survey-app-dev のプレビュー
#   develop への push        → survey-app-dev の本番URL（開発環境）
# 本番（SO.様）は移管が済むまで旧プロジェクトのGit連携のまま。移管時に deploy-prod.yml を追加する。

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # PR はプレビュー、それ以外（develop への push・手動実行）は開発用プロジェクトの本番URL
      VERCEL_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vercel の Settings → Build and Deployment → Node.js Version と揃える
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@65

      - name: Pull Vercel settings and environment variables
        run: vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"

      - name: Build
        run: |
          if [ "$VERCEL_TARGET" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        run: |
          if [ "$VERCEL_TARGET" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "### Deployed ($VERCEL_TARGET): $url" >> "$GITHUB_STEP_SUMMARY"
