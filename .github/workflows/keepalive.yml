name: Supabase Keepalive

on:
  schedule:
    - cron: "0 0 * * *"  # 毎日 0:00 UTC (日本時間 9:00)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        url:
          - https://tom-survey-app.vercel.app/api/keepalive
          - https://survey-app-git-develop-tom-5990s-projects.vercel.app/api/keepalive
    steps:
      - name: Ping ${{ matrix.url }}
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${{ matrix.url }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Response: $RESPONSE"
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Failed with HTTP status: $HTTP_STATUS"
            exit 1
          fi
